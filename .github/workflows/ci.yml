name: CI

on:
  push:
  pull_request:
  # Every Monday at 05:00 UTC on the default branch, also without a push: nothing
  # updates the pinned images and dependencies by itself, so the image scan below
  # is what notices a vulnerability found after the last push.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test and check format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Run ./mvnw verify
        run: ./mvnw --batch-mode --no-transfer-progress verify

  image:
    name: Build the image and start it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Passwords for this run only, generated here; nothing is stored.
      - name: Write a throwaway .env
        run: |
          {
            echo "POSTGRES_DB=library"
            echo "POSTGRES_USER=library"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_OWNER_USER=library_owner"
            echo "DB_OWNER_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_APP_USER=library_app"
            echo "DB_APP_PASSWORD=$(openssl rand -hex 16)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
          } > .env

      # --wait returns once every container reports healthy (the application's
      # Docker health check), or fails after the timeout.
      - name: Start PostgreSQL, Redis and the application
        run: docker compose --profile app up --detach --build --wait --wait-timeout 180

      - name: Check that the application is ready
        run: curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/readiness

      # Known vulnerabilities in the image that was just built (the Alpine packages
      # and the jars of the application) and secrets left in its layers. The run
      # fails on a HIGH or CRITICAL vulnerability that has a fixed version to move
      # to, or on a secret; other vulnerabilities are listed only. Trivy
      # runs from its own image, pinned by digest (0.76.2), and reads the image
      # from a file, so it needs no access to the Docker daemon.
      - name: Scan the image for vulnerabilities
        run: |
          docker save library-api:local --output "$RUNNER_TEMP/image.tar"
          docker run --rm --volume "$RUNNER_TEMP/image.tar:/image.tar:ro" \
            aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar --scanners vuln,secret --no-progress \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1

      - name: Show the application log
        if: failure()
        run: docker compose --profile app logs app
