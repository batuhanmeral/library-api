# Production. The connection comes from environment variables. If DB_URL is
# missing, the placeholder stays as text and startup fails with
# "'url' must start with "jdbc"".
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

library:
  security:
    jwt:
      secret: ${JWT_SECRET}
    # Optional: set both once to create the first administrator, then they may be
    # removed. An existing account is never changed.
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema) instead of text: log
      # tools read the fields directly, the request id is a field of its own,
      # and a line break in a message is escaped instead of starting a new line.
      console: ecs
