# Production. The connection comes from environment variables. If DB_URL is
# missing, the placeholder stays as text and startup fails with
# "'url' must start with "jdbc"".
spring:
  # The application's user may only read and write rows; the migrations run as
  # the owner of the schema, with a connection of their own that is closed when
  # they are done. Both may be the same user where the database has only one.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    user: ${DB_MIGRATION_USERNAME}
    password: ${DB_MIGRATION_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

library:
  security:
    jwt:
      secret: ${JWT_SECRET}
    # Optional: set both once to create the first administrator, then they may be
    # removed. An existing account is never changed.
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

# The OpenAPI description (/v3/api-docs) and Swagger UI are off in production
# unless API_DOCS_ENABLED=true: they list every path and field, which a public
# deployment does not need to advertise.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

logging:
  structured:
    format:
      # One JSON object per line (Elastic Common Schema) instead of text: log
      # tools read the fields directly, the request id is a field of its own,
      # and a line break in a message is escaped instead of starting a new line.
      console: ecs
