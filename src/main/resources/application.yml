# Settings shared by every profile. The database connection is set per profile:
# application-dev.yml (local Docker PostgreSQL) and application-prod.yml
# (environment variables). Tests set no profile and get an in-memory H2 database.
spring:
  application:
    name: library-api
  web:
    # Validation and error messages are always in English, whatever the
    # machine's or the client's language is.
    locale: en
    locale-resolver: fixed
  jpa:
    # Do not keep the database session open while the HTTP response is written.
    open-in-view: false
    hibernate:
      # Flyway creates the schema (src/main/resources/db/migration). Hibernate
      # only checks at startup that the entities match it.
      ddl-auto: validate
    properties:
      # A paged query that also fetches a collection cannot be paged in SQL;
      # Hibernate would load every matching row and cut the page in memory
      # (warning HHH90003004). Fail instead, so such a query never ships.
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  data:
    web:
      pageable:
        # ?size=500 is served as a page of 100. The default size is 20.
        max-page-size: 100
  task:
    # The executor behind @Async (POST /admin/jobs/overdue-check). Two threads,
    # up to four when ten tasks are already waiting; more are refused.
    execution:
      thread-name-prefix: library-task-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 10
      shutdown:
        # On shutdown, let a running job finish (at most 30 seconds).
        await-termination: true
        await-termination-period: 30s
    # The thread that runs @Scheduled methods.
    scheduling:
      thread-name-prefix: library-scheduling-
      shutdown:
        await-termination: true
        await-termination-period: 30s

# The library's own settings, bound to LibraryProperties and LoanProperties.
library:
  # "Today" for loans and the time of the nightly job. The machine's time zone
  # does not matter.
  time-zone: Europe/Istanbul
  scheduling:
    # Scheduled jobs run by themselves. The tests turn this off.
    enabled: true
  loan:
    max-active-loans: 3
    period-days: 14
    overdue-check:
      # second minute hour day-of-month month day-of-week: every day at 02:00,
      # in library.time-zone.
      cron: "0 0 2 * * *"
      # Members per transaction.
      batch-size: 100
  # Open Library (https://openlibrary.org), asked for the details of a book
  # that is added with an ISBN. Bound to OpenLibraryProperties.
  open-library:
    base-url: https://openlibrary.org
    # A call must not hold a request thread for long: give up on a server that
    # does not accept the connection in 2 s or does not answer in 3 s.
    connect-timeout: 2s
    read-timeout: 3s
    # Open Library asks clients to say who they are. A generic name, no
    # personal contact details.
    user-agent: "library-api (Spring Boot learning project)"
