spring:
  application:
    name: library-api
  datasource:
    # In-memory H2 database; data is lost when the application stops.
    url: jdbc:h2:mem:library
  web:
    # Validation and error messages are always in English, whatever the
    # machine's or the client's language is.
    locale: en
    locale-resolver: fixed
  jpa:
    # Do not keep the database session open while the HTTP response is written.
    open-in-view: false
    hibernate:
      # Flyway creates the schema (src/main/resources/db/migration). Hibernate
      # only checks at startup that the entities match it.
      ddl-auto: validate
  h2:
    console:
      # Web console at /h2-console. It only accepts connections from localhost.
      enabled: true

logging:
  level:
    # Print the SQL statements Hibernate runs.
    org.hibernate.SQL: debug
