# Test settings, layered over src/main/resources/application.yml: Spring Boot
# reads both, and classpath:/config/ wins over classpath:/. Only the tests have
# this file on their classpath.
spring:
  datasource:
    hikari:
      # The test contexts are cached and each keeps its pool open, all against one
      # PostgreSQL container (DatabaseTest). Small pools keep the total
      # low; six is enough for the largest race in LoanConcurrencyTest (five).
      maximum-pool-size: 6
  cache:
    # No cache: a test never reads an entry another test left behind. CachingTest
    # turns on an in-memory cache for itself.
    type: none
library:
  scheduling:
    # Scheduled jobs do not start by themselves in tests; a test runs the job
    # when it needs it.
    enabled: false
  # Tests never call the real Open Library. Nothing listens on port 1, so a
  # call that is not mocked fails at once instead of reaching the internet.
  open-library:
    base-url: http://127.0.0.1:1
  security:
    jwt:
      # A dummy key for tests only: Base64 of 32 times "x". Every real environment
      # has its own random JWT_SECRET.
      secret: eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
management:
  health:
    redis:
      # The tests have no Redis (RedisCacheTest starts its own); its health check
      # would report DOWN and turn /actuator/health DOWN with it.
      enabled: false
